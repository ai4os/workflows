name: LiteLLM Model Discovery

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  model-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Model Discovery
        env:
          LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          ENGRAMMER_API_KEY: ${{ secrets.ENGRAMMER_API_KEY }}
          IFCA01_API_KEY: ${{ secrets.IFCA01_API_KEY }}
          IISAS01_API_KEY: ${{ secrets.IISAS01_API_KEY }}
        run: |
          python litellm/model_discovery.py
